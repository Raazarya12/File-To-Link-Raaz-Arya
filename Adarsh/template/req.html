<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta property="og:image"
          content="https://i.postimg.cc/k4qq2Kb7/opus.png"
          itemprop="thumbnailUrl">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>%s</title>

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Raleway">

    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css?family=Delius">

    <link rel="stylesheet"
          href="https://cdn.plyr.io/3.6.9/plyr.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Raleway, sans-serif;
        }

        header {
            width: 100%%;
            background: #808080;
            text-align: center;
        }

        marquee {
            font-size: 25px;
            font-weight: 800;
            color: black;
            font-family: serif;
            padding: 8px 0;
        }

        .container {
            width: 100%%;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .player {
            width: 100%%;
            max-height: 80vh;
        }

        footer {
            color: white;
            text-align: center;
            padding: 20px;
        }

        footer h4 {
            font-weight: normal;
        }

        footer a {
            color: white;
        }
    </style>
</head>

<body>

<header>
    <marquee bgcolor="#808080">
        <div id="file-name">
            %s
        </div>
    </marquee>
</header>

<div class="container">

    <tag
        class="player"
        src="%s"
        controls
        playsinline
        preload="metadata">
    </tag>

</div>

<footer>

    <h4>
        Video not playing? Your browser or device may not support
        this codec. Please download and watch.
    </h4>

    <p>
        <a href="https://youtube.com/Latest_Movies_FreeOnnet" target="_blank">
            <img
                src="https://i.postimg.cc/k4qq2Kb7/opus.png"
                alt="OpusLogo"
                width="150"
                height="75">
        </a>
    </p>

</footer>

<script src="https://cdn.plyr.io/3.6.9/plyr.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const player = new Plyr(".player", {
        controls: [
            "play-large",
            "rewind",
            "play",
            "fast-forward",
            "progress",
            "current-time",
            "duration",
            "mute",
            "volume",
            "captions",
            "settings",
            "pip",
            "airplay",
            "fullscreen"
        ]
    });

});
</script>

</body>
</html>
